<dialog id="contactModal">
  <div class="modal-header">
    <h2>Форма обратной связи</h2>
  </div>

  <div class="modal-content">
    <form id="feedbackForm" method="dialog">
      <div class="form-group">
        <label for="name">Имя <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Введите ваше имя"
        />
      </div>

      <div class="form-group">
        <label for="phone">Телефон <span class="required">*</span></label>
        <input
          type="tel"
          id="phone"
          name="phone"
          required
          placeholder="+1 800-555-35-35"
        />
      </div>

      <div class="form-group">
        <label for="email"
          >Электронная почта <span class="required">*</span></label
        >
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="mailey.cyrus@tamtam.ru"
        />
      </div>

      <div class="form-group">
        <label for="category"
          >Категория обращения <span class="required">*</span></label
        >
        <select id="category" name="category" required>
          <option value="">Выберите категорию</option>
          <option value="signature">Сделать сигну</option>
          <option value="commercial">Коммерческое предложение</option>
          <option value="clothing">Покупка моей одежды</option>
          <option value="complaint">Жалоба</option>
          <option value="greeting">Передать привет</option>
          <option value="other">Другое</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message"
          >Текст обращения <span class="required">*</span></label
        >
        <textarea
          id="message"
          name="message"
          required
          placeholder="Опишите вашу проблему или вопрос..."
        ></textarea>
      </div>

      <div class="modal-actions">
        <!-- Кнопка отмены с автоматическим закрытием через form method="dialog" -->
        <button type="submit" class="btn btn-secondary">Отмена</button>
        <!-- Кнопка отправки с обработкой через JavaScript -->
        <button type="button" class="btn btn-primary" onclick="submitForm()">
          Отправить
        </button>
      </div>
    </form>
  </div>
</dialog>
